name: Synchroniser agenda ICC

on:
  schedule:
    - cron: "0 9 * * *"   # tous les jours vers 4 h (heure du Québec)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
  push:                    # relance quand le script change
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Générer icc.ics
        env:
          SOURCE_URL_MTL: ${{ secrets.SOURCE_URL_MTL }}
          SOURCE_URL_LGL: ${{ secrets.SOURCE_URL_LGL }}
        run: python scripts/build_ics.py

      - name: Publier si changement
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Mise à jour agenda ICC"
          git push
